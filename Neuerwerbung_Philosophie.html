<div id="uphil">
            <div class="link 0" id="1"></div>
            <div class="link 1" id="2"></div>
            <div class="link 2" id="3"></div>
        </div>
<script>
// mon = 1 bedeutet letzter Monat, mon = 2 bedeutet vorvorletzter Monat usw.
function Neuerwerbung_UPHIL(mon, lang) {
    console.log(mon);
    // Datum heute
    const d = new Date(Date.now());
    const Datum = d.toISOString();
    // ISO-String z.B. "2022-02-18T13:38:17.783Z"
    let Jahr = Datum.slice(0,4);
    //console.log(Jahr);
    const Monat = Datum.slice(5,7);
    
    // Letztes Jahr
    const ynum = Number(Jahr); 
    const lynum = ynum - 1;
    const LetztesJahr = String(lynum);
    
    //  Letzter Monat
    const mnum = Number(Monat);
    const lm = mnum -1
    const LetzterMonat = ("0" + lm).slice(-2);
    
    // Bsp für Suchstring
    //Suchstring1 = Z01SE202204*
    //Suchstring2 = UPHIL-202204
    let Suchstring1 = "Z01SE";
    let Suchstring2 = "UPHIL-";

    let aquisitionProposal, institutionallink, prefix;
    // Monat festlegen
    if (lang === "en"){
        var monate = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var linkPart1 = "https://uzb.swisscovery.ch/discovery/search?tab=LibraryCatalog&search_scope=MyInstitution&vid=41SLSP_UZB:UZB&lang=en&offset=0&query=any,contains,";
        aquisitionProposal = '<ul><li><a href="https://www.ub.uzh.ch/en/contact/anschaffungsvorschlag.html" target="_blank" rel="noopener noreferrer">Acquisition proposal</a></li></ul>';
        institutionallink = '<ul><li><a href="https://www.philosophie.uzh.ch/en.html" target="_blank" rel="noopener noreferrer">Department of Philosophy</a></li></ul>';
        prefix = "New acquisitions: ";
    } else {
        var monate = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        var linkPart1 = "https://uzb.swisscovery.ch/discovery/search?tab=LibraryCatalog&search_scope=MyInstitution&vid=41SLSP_UZB:UZB&offset=0&query=any,contains,";
        aquisitionProposal = '<ul><li><a href="https://www.ub.uzh.ch/de/contact/anschaffungsvorschlag.html" target="_blank" rel="noopener noreferrer">Anschaffungsvorschlag</a></li></ul>';
        institutionallink = '<ul><li><a href="https://www.philosophie.uzh.ch/de.html" target="_blank" rel="noopener noreferrer">Philosophisches Seminar</a></li></ul>';
        prefix = "Neuerwerbungen: ";
    }

    
    let xm = mnum - mon;
    
    if (xm < 1){
        xm = 12 + xm;
        Jahr = LetztesJahr;
    }
    let ym = xm - 1; 
    let monatString = monate[ym];

    let xm_string;
    
    xm_string = ("0" + xm).slice(-2);
    Suchstring1 += Jahr + xm_string + "*";
    Suchstring2 += Jahr + xm_string;
    
    const linkPart2 = ",AND&query=lds56,contains,100,OR&query=any,contains,";
    const linkPart3 = ",AND&tab=LibraryCatalog&search_scope=MyInstitution&vid=41SLSP_UZB:UZB&mode=advanced&offset=0";
    
    let link = linkPart1 + Suchstring1 + linkPart2 + Suchstring2 + linkPart3;
    let return_arr = [link, monatString, aquisitionProposal, institutionallink, prefix];
    
    return return_arr;

}

// Linkliste erstellen
document.addEventListener("DOMContentLoaded", function() {
    let anchor = document.querySelector('#uphil');
    let ancElments = document.querySelectorAll('#uphil .link');
    let lang = document.documentElement.lang;
    let ancContents = "";
    let startContent, philLink; 
    ancElments.forEach(function(element) {
        let mon = Number(element.classList[1]);
        let return_arr = Neuerwerbung_UPHIL(mon, lang);
        
        startContent = return_arr[2];
        ancContents += '<li><a href=' + return_arr[0] + ' target="_blank" rel="noopener noreferrer">' + return_arr[4] + return_arr[1] + '</a></li>';
        philLink = return_arr[3];
    });
    
    
    anchor.innerHTML = startContent + '<ul>' + ancContents + '</ul>' + philLink;
});
</script>
