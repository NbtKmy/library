<!-- teaser-Name "neuerscheinungen" (DE) oder "neuerscheinungen_en" (EN) -->

<div id="uaoij">
  <div class="link 1" id="1"></div>
</div>

<script>
// mon = 1 bedeutet letzter Monat, mon = 2 bedeutet vorvorletzter Monat usw.
// lang = ISO 639-1 Code entweder de oder en...
function Neuerwerbung_UAOIJ(mon, lang) {
    //console.log(mon);
    // Datum heute
    const d = new Date(Date.now());
    const Datum = d.toISOString();
    // ISO-String z.B. "2022-02-18T13:38:17.783Z"
    let Jahr = Datum.slice(0,4);
    //console.log(Jahr);
    const Monat = Datum.slice(5,7);
    
    // Letztes Jahr
    const ynum = Number(Jahr); 
    const lynum = ynum - 1;
    const LetztesJahr = String(lynum);
    
    //  Letzter Monat
    const mnum = Number(Monat);
    const lm = mnum -1
    const LetzterMonat = ("0" + lm).slice(-2);
    
    // Bsp für Suchstring
    let SuchstringJap = "UAOIJ-";
    let SuchstringEng = "UAOIO-"
    let aquisitionProposal, institutionallink, prefix, libraryDepartmentJap, libraryDepartmentEng;
    // Monat festlegen
    if (lang === "en"){
        var monate = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var linkPart1 = "https://uzb.swisscovery.ch/discovery/search?tab=LibraryCatalog&search_scope=MyInstitution&vid=41SLSP_UZB:UZB&lang=en&offset=0&query=any,contains,";
        aquisitionProposal = '<p><a href="https://www.ub.uzh.ch/en/contact/anschaffungsvorschlag.html" target="_blank" rel="noopener noreferrer">Acquisition proposal</a></p>';
        institutionallink = '<p><a href="https://www.aoi.uzh.ch/en/japanologie.html" target="_blank" rel="noopener noreferrer">Japanese Studies</a></p>';
        prefix = "New acquisitions: ";
        libraryDepartmentJap = "Books in Japanese";
        libraryDepartmentEng = "Books in other languages";
    } else {
        var monate = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        var linkPart1 = "https://uzb.swisscovery.ch/discovery/search?tab=LibraryCatalog&search_scope=MyInstitution&vid=41SLSP_UZB:UZB&offset=0&query=any,contains,";
        aquisitionProposal = '<p><a href="https://www.ub.uzh.ch/de/contact/anschaffungsvorschlag.html" target="_blank" rel="noopener noreferrer">Anschaffungsvorschlag</a></p>';
        institutionallink = '<p><a href="https://www.aoi.uzh.ch/de/japanologie.html" target="_blank" rel="noopener noreferrer">Japanologie</a></p>';
        prefix = "Neuerwerbungen: ";
        libraryDepartmentJap = "Japanisch";
        libraryDepartmentEng = "Westlichsprachig";
    }
    
    
    let xm = mnum - mon;
    
    if (xm < 1){
        xm = 12 + xm;
        Jahr = LetztesJahr;
    }
    let ym = xm - 1; 
    let monatString = monate[ym];

    let xm_string;
    
    xm_string = ("0" + xm).slice(-2);
    SuchstringJap += Jahr + xm_string + "*";
    SuchstringEng += Jahr + xm_string + "*";

    
    
    
    let linkJap = linkPart1 + SuchstringJap;
    let linkEng = linkPart1 + SuchstringEng;
    let htmlContents = aquisitionProposal + '<ul><li><a href="' + linkJap + '" target="_blank" rel="noopener noreferrer">' + libraryDepartmentJap + '</a></li><li><a href="' + linkEng + '" target="_blank" rel="noopener noreferrer">' + libraryDepartmentEng + '</a></li></ul>' + institutionallink;
    
    return htmlContents;

}

// Linkliste erstellen
document.addEventListener("DOMContentLoaded", function() {
    let anchor = document.querySelector('#uaoij');
    let ancElments = document.querySelectorAll('#uaoij .link');
    let lang = document.documentElement.lang;
    anchor.innerHTML = Neuerwerbung_UAOIJ(1, lang);
  });
  
</script>
